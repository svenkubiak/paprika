# Environments configuration:

environments:
  test:
    connector:
      http:
        port: 9090
    application:
      admin:
        enable: false
    session:
      cookie:
        secret: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        key: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        secure: false
    flash:
      cookie:
        secret: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        key: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        secure: false
    authentication:
      cookie:
        secret: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        key: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        secure: false
    persistence:
      mongo:
        embedded: true
        host: localhost
        port: 29019
        package: models
    paprika:
      storage:
        root: target/test-storage

  dev:
    connector:
      http:
        port: 9090
    session:
      cookie:
        secret: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        key: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        secure: false
    flash:
      cookie:
        secret: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        key: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        secure: false
    authentication:
      cookie:
        secret: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        key: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        secure: false
      redirect:
        login: /login
    persistence:
      mongo:
        embedded: true
        host: localhost
        port: 29019
        package: models

  prod:
    paprika:
      storage: env{}
    token:
