      key: env{}
    application:
      secret: env{}
      parameter:
        strict: true
    connector:
      http:
        host: env{}
        port: env{}
    session:
      cookie:
        secure: true
        secret: env{}
        key: env{}
    flash:
      cookie:
        secure: true
        secret: env{}
        key: env{}
    authentication:
      cookie:
        secure: true
        secret: env{}
        key: env{}
    smtp:
      host: env{}
      port: env{}
      username: env{}
      password: env{}
      from: env{}
      from-name: env{}
      protocol: env{}
      authentication: env{}
    persistence:
      mongo:
        embedded: false
        host: env{}
        port: env{}
        dbname: paprika
        username: env{}
        password: env{}
        authdb: admin
        auth: true
        package: models