# Defaults for all environments; the active environment (dev, test, prod) overrides them.

default:
  undertow:
    # 64 MiB (67,108,864 bytes). Docs, the admin UI and the proxy examples use this same ceiling.
    # A field's default maxSize stays at 4,000,000; raising it is bounded by this request limit.
    maxentitysize: 67108864
  form:
    maxfilesize: 67108864
  application:
    name: paprika
    secret: tXbwvKVetgZSi1VSIEGTsPcIWmSwajJuQkYrx7OSwwGdGZ3J5yGi8IFiGhVEuT6T
    language: en
    admin:
      enable: false
    parameter:
      strict: true
    validation:
      # Answers constraint violations as JSON, not mangoo's HTML page. Messages pass through
      # verbatim: never put user input or EL (${...}) into a DTO constraint message.
      passthrough: true
  connector:
    http:
      host: localhost
      port: 8080
  session:
    cookie:
      name: paprika-session
      secret: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
      key: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
      secure: true
  authentication:
    hashing:
      # Milliseconds to wait for a free Argon2 slot before answering 429 (mangoo default 5000). One
      # verification takes ~40 ms, so 200 absorbs bursts and still fails fast under real load.
      timeout: 200
      # Argon2 memory/iterations/parallelism keep mangoo's defaults (32768 KB, 3, 1), above OWASP.
      # concurrency derives from the heap: with fewer cores than slots, pin it to the core count.
    redirect:
      # Required: without it, unauthenticated requests to withAuthentication() routes (including /)
      # get mangoo's default 401 page instead of a redirect. Keep it in the defaults.
      login: /login
    # Appends the requested path as origin to the login redirect, so an expired session on a deep
    # link returns there after sign-in.
    origin: true
    # Revokes the admin UI cookie on logout, and every cookie of an account on a password or 2FA
    # change. mangoo keeps the revocations in MongoDB, shared by every instance and kept across restarts.
    blacklist: true
    cookie:
      name: paprika-authentication
      secret: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
      key: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
      secure: true
      token:
        # Seconds; an absolute lifetime from sign-in, not a sliding window. Set explicitly because
        # the admin UI tells users this is why they were signed out.
        expires: 3600
  token:
    secret: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
    key: defaultTokenKeyForLocalDevOnly0000000000000000000000000000000000
  paprika:
    bootstrap:
      superadmin-username: admin
      default-tenant-name: Default
      default-tenant-slug: default
    # Must stay a scalar: an env{} override replaces a nested block's whole subtree (mangoo only
    # merges map with map). Environment variable: PAPRIKA_STORAGE.
    storage: storage
  flash:
    cookie:
      name: paprika-flash
      secret: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
      key: defaultTokenKeyForLocalDevOnly0000000000000000000000000000000000
      secure: true
  smtp:
    host: ""
    port: 587
    username: ""
    password: ""
    from: no-reply@localhost
    # Underscore, not a hyphen, so the env variable SMTP_FROM_NAME can be set in a POSIX shell.
    from_name: Paprika
    protocol: smtp
    authentication: false

environments:
  test:
    connector:
      http:
        port: 9090
    application:
      admin:
        enable: false
    session:
      cookie:
        secret: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        key: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        secure: false
    flash:
      cookie:
        secret: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        key: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        secure: false
    authentication:
      # One slot; the suite hashes sequentially, well within the 200 ms timeout. Overload is tested
      # through the hashing seams (PasswordHashOverloadTest, PasswordHashRefusalTest).
      # Memory and iterations at mangoo's minimum: the suite hashes on almost every login and user it
      # creates, and with the production cost that alone takes about half a minute.
      hashing:
        concurrency: 1
        memory: 8192
        iterations: 2
      cookie:
        secret: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        key: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        secure: false
    persistence:
      mongo:
        embedded: true
        host: localhost
        port: 29019
        package: models
    paprika:
      storage: target/test-storage
    smtp:
      # The GreenMail server of the recovery mail tests. mangoo builds its mail session once from
      # this config; tests without GreenMail just see the async send fail.
      host: localhost
      port: 3025
      from: no-reply@paprika.test
      from_name: Paprika Test
      authentication: false

  dev:
    connector:
      http:
        port: 9090
    session:
      cookie:
        secret: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        key: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        secure: false
    flash:
      cookie:
        secret: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        key: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        secure: false
    authentication:
      cookie:
        secret: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        key: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        secure: false
    persistence:
      mongo:
        embedded: true
        host: localhost
        port: 29019
        package: models

  prod:
    paprika:
      storage: env{}
    token:
      secret: file{}
      key: file{}
    application:
      secret: file{}
      parameter:
        strict: true
      admin:
        enable: env{false}
        username: env{?}
        password: env{?}
        secret: file{?}
    connector:
      http:
        host: env{}
        port: env{}
    metrics:
      enable: env{false}
    session:
      cookie:
        secure: true
        secret: file{}
        key: file{}
    flash:
      cookie:
        secure: true
        secret: file{}
        key: file{}
    authentication:
      cookie:
        secure: true
        secret: file{}
        key: file{}
    # Optional: with an empty or missing smtp.host no mail is sent. file{?} leaves a key unset, which
    # brings back mangoo's defaults (port 25, smtps), so the keys that need Paprika's values carry them
    # as fallback. The install scripts prepare these files empty.
    smtp:
      host: file{?}
      port: file{465}
      username: file{?}
      password: file{?}
      from: file{no-reply@localhost}
      from_name: file{Paprika}
      protocol: file{smtps}
      authentication: file{false}
    persistence:
      mongo:
        embedded: false
        # A connection string (replica set, sharded cluster, SRV) replaces host and port
        url: env{?}
        host: env{?}
        port: env{?}
        dbname: paprika
        username: env{}
        password: file{}
        authdb: admin
        auth: true
        package: models
