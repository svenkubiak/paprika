# Application configuration
#
# The configuration consists of default values that are common in all environments and
# environment specific values for dev, test, and prod.
#
# Values in an active environment overwrite default values
#
# Default configuration:

default:
  application:
    name: paprika
    secret: tXbwvKVetgZSi1VSIEGTsPcIWmSwajJuQkYrx7OSwwGdGZ3J5yGi8IFiGhVEuT6T
    language: en
    admin:
      enable: false
    vault:
      enable: false
    parameter:
      strict: true
    validation:
      # Paprika is a JSON API, so a constraint violation has to answer with a machine-readable
      # body. Without this, mangoo replies 400 with the framework's default HTML error page,
      # which tells a client nothing and ends up in the admin UI verbatim.
      #
      # This passes the constraint messages through to the caller. All of them are hand-written
      # constants on the DTOs - never put user input or an EL expression (${...}) into a
      # message, because Hibernate Validator interpolates it and it would be reflected here.
      passthrough: true
  connector:
    http:
      host: localhost
      port: 8080
  session:
    cookie:
      name: paprika-session
      secret: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
      key: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
      secure: true
  authentication:
    redirect:
      # The key mangoo reads is authentication.redirect.login. Without it an unauthenticated
      # request to a route bound withAuthentication() does not redirect at all, it ends with
      # the framework's default 401 page - which is what the whole admin UI looked like in
      # production, because / is such a route. Belongs in the defaults, not in an environment.
      login: /login
    # Makes mangoo append the requested path as an origin parameter to that redirect, so a
    # session that runs out on a deep link does not dump the admin back on the dashboard.
    origin: true
    cookie:
      name: paprika-authentication
      secret: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
      key: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
      secure: true
      token:
        # One hour, which is also mangoo's default - set explicitly because the admin UI tells
        # the user this is why they were signed out, and that should not silently change with a
        # framework upgrade. The cookie is only reissued when a request arrives without one, so
        # this is an absolute lifetime from sign-in, not a sliding window.
        expires: 3600
  token:
    secret: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
    key: defaultTokenKeyForLocalDevOnly0000000000000000000000000000000000
  paprika:
    bootstrap:
      superadmin-username: admin
      default-tenant-name: Default
      default-tenant-slug: default
    # A single scalar, not a nested block: an environment overrides this with env{}, and mangoo's
    # config merge only recurses when both sides are maps. A scalar override of a nested block
    # replaces the whole subtree, so paprika.storage.root would stop existing in that environment
    # and every reader would silently fall back to its hardcoded default (see ConfigYamlTest).
    # The derived environment variable is PAPRIKA_STORAGE.
    storage: storage
  flash:
    cookie:
      name: paprika-flash
      secret: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
      key: defaultTokenKeyForLocalDevOnly0000000000000000000000000000000000
      secure: true
  smtp:
    host: ""
    port: 587
    username: ""
    password: ""
    from: no-reply@localhost
    # Underscore, not a hyphen: the environment variable is the key upper-cased with dots turned
    # into underscores, and SMTP_FROM-NAME cannot be set in a POSIX shell. SMTP_FROM_NAME can.
    from_name: Paprika
    protocol: smtp
    authentication: false

# Environments configuration:

environments:
  test:
    connector:
      http:
        port: 9090
    application:
      admin:
        enable: false
    session:
      cookie:
        secret: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        key: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        secure: false
    flash:
      cookie:
        secret: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        key: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        secure: false
    authentication:
      cookie:
        secret: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        key: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        secure: false
    persistence:
      mongo:
        embedded: true
        host: localhost
        port: 29019
        package: models
    paprika:
      storage: target/test-storage
    smtp:
      # Points at the GreenMail server the recovery mail tests start on this port. Set here
      # because mangoo builds its mail session once from the configuration; tests that do not
      # start GreenMail simply see the asynchronous send fail and log, which does not affect them.
      host: localhost
      port: 3025
      from: no-reply@paprika.test
      from_name: Paprika Test
      authentication: false

  dev:
    connector:
      http:
        port: 9090
    session:
      cookie:
        secret: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        key: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        secure: false
    flash:
      cookie:
        secret: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        key: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        secure: false
    authentication:
      cookie:
        secret: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        key: defaultTokenSecretForLocalDevOnly0000000000000000000000000000000
        secure: false
    persistence:
      mongo:
        embedded: true
        host: localhost
        port: 29019
        package: models

  prod:
    paprika:
      storage: env{}
    token:
      secret: env{}
      key: env{}
    application:
      secret: env{}
      parameter:
        strict: true
    connector:
      http:
        host: env{}
        port: env{}
    session:
      cookie:
        secure: true
        secret: env{}
        key: env{}
    flash:
      cookie:
        secure: true
        secret: env{}
        key: env{}
    authentication:
      cookie:
        secure: true
        secret: env{}
        key: env{}
    smtp:
      host: env{}
      port: env{}
      username: env{}
      password: env{}
      from: env{}
      from_name: env{}
      protocol: env{}
      authentication: env{}
    persistence:
      mongo:
        embedded: false
        host: env{}
        port: env{}
        dbname: paprika
        username: env{}
        password: env{}
        authdb: admin
        auth: true
        package: models