services:

  paprika:
    # PAPRIKA_IMAGE in .env runs another image, e.g. one built locally to test an unreleased version
    image: ${PAPRIKA_IMAGE:-ghcr.io/svenkubiak/paprika:latest}
    container_name: paprika
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    environment:
      APPLICATION_MODE: prod
      CONNECTOR_HTTP_HOST: "0.0.0.0"
      CONNECTOR_HTTP_PORT: "8080"
      PAPRIKA_STORAGE: /app/storage
      PERSISTENCE_MONGO_HOST: mongodb
      PERSISTENCE_MONGO_PORT: "27017"
      PERSISTENCE_MONGO_USERNAME: ${MONGO_USERNAME}
    # Secrets and SMTP settings are files in ./secrets, named like their config key, where Paprika
    # reads them. They stay out of the environment, so they show up neither in docker inspect nor in
    # child processes.
    volumes:
      - ./storage:/app/storage
      - ./secrets:/run/secrets:ro
    # mangoo's readiness probe: 503 during startup and shutdown, no database check. Plain HTTP over
    # bash's /dev/tcp, because bash is already in the image and curl is not.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /@health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Startup order only. Paprika waits until MongoDB's own healthcheck passes.
    # A database that dies later does not stop this container; GET /health reports that.
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongodb/mongodb-community-server:7.0-ubi9-slim
    container_name: paprika-mongodb
    restart: unless-stopped
    environment:
      # Bootstrap-only root credential: creates the database and runs mongo-init.js on first
      # start, but is never handed to the paprika container. mongo-init.js creates the scoped
      # MONGO_USERNAME user paprika actually authenticates as (readWriteAnyDatabase +
      # dbAdminAnyDatabase — everything Paprika's per-tenant database provisioning needs, without
      # the user-management or server-administration rights a root account would also carry).
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/mongodb-secrets/mongo.root.password
      MONGO_APP_USERNAME: ${MONGO_USERNAME}
    # ./secrets for mongo-init.js, which reads the password of the scoped user from the file Paprika
    # reads it from. The root password has a directory of its own that only this container mounts.
    volumes:
      - mongodb-data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - ./secrets:/run/secrets:ro
      - ./mongodb-secrets:/run/mongodb-secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$(cat /run/mongodb-secrets/mongo.root.password)\" --authenticationDatabase admin --eval 'db.adminCommand({ping:1})'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  mongodb-data:
