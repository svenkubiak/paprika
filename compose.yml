services:

  paprika:
    image: ghcr.io/svenkubiak/paprika:latest
    container_name: paprika
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    # Every Paprika setting, including the signing secrets and SMTP, comes from .env.
    # Compose also reads that file for ${} interpolation (HOST_PORT, the mongodb service).
    env_file:
      - path: .env
        required: true
    environment:
      # Fixed by this stack. They override .env, so a host path or a loopback
      # bind in the file cannot point the process at the wrong place.
      APPLICATION_MODE: prod
      CONNECTOR_HTTP_HOST: "0.0.0.0"
      CONNECTOR_HTTP_PORT: "8080"
      PAPRIKA_STORAGE: /app/storage
      PERSISTENCE_MONGO_HOST: mongodb
      PERSISTENCE_MONGO_PORT: "27017"
      # Older .env files named the scoped user MONGO_USERNAME/MONGO_PASSWORD.
      PERSISTENCE_MONGO_USERNAME: ${PERSISTENCE_MONGO_USERNAME:-${MONGO_USERNAME}}
      PERSISTENCE_MONGO_PASSWORD: ${PERSISTENCE_MONGO_PASSWORD:-${MONGO_PASSWORD}}
      # The same .env holds the MongoDB root password and HOST_PORT for Compose
      # itself. An empty value overrides env_file, so those secrets stay on
      # the mongodb service and are not readable in this container. Compose
      # treats null as "unset" and would keep the env_file value.
      MONGO_ROOT_USERNAME: ""
      MONGO_ROOT_PASSWORD: ""
      MONGO_USERNAME: ""
      MONGO_PASSWORD: ""
      HOST_PORT: ""
    volumes:
      # Host path must be readable and writable by uid 33 (image user appuser).
      # install-docker.sh chowns it; a directory you created yourself needs
      # `sudo chown -R 33:1000 storage && sudo chmod 750 storage`.
      - ./storage:/app/storage
    # Same check as nc -z. Bash is already in the image; nc and curl are not.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/8080'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Startup order only. Paprika waits until MongoDB's own healthcheck passes.
    # A database that dies later does not stop this container; GET /health reports that.
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongodb/mongodb-community-server:7.0-ubi9-slim
    container_name: paprika-mongodb
    restart: unless-stopped
    environment:
      # Bootstrap-only root credential: creates the database and runs mongo-init.js on first
      # start, but is never handed to the paprika container. mongo-init.js creates the scoped
      # PERSISTENCE_MONGO_USERNAME/PERSISTENCE_MONGO_PASSWORD user paprika authenticates as
      # (readWriteAnyDatabase + dbAdminAnyDatabase — everything Paprika's per-tenant database
      # provisioning needs, without the user-management or server-administration rights a root
      # account would also carry). Older .env files used MONGO_USERNAME/MONGO_PASSWORD.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_USERNAME: ${PERSISTENCE_MONGO_USERNAME:-${MONGO_USERNAME}}
      MONGO_APP_PASSWORD: ${PERSISTENCE_MONGO_PASSWORD:-${MONGO_PASSWORD}}
    volumes:
      - mongodb-data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand({ping:1})'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  mongodb-data: