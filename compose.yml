services:

  paprika:
    image: ghcr.io/svenkubiak/paprika:latest
    container_name: paprika
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    environment:
      APPLICATION_MODE: prod
      CONNECTOR_HTTP_HOST: "0.0.0.0"
      CONNECTOR_HTTP_PORT: "8080"
      PAPRIKA_STORAGE: /app/storage
      PERSISTENCE_MONGO_HOST: mongodb
      PERSISTENCE_MONGO_PORT: "27017"
      APPLICATION_SECRET: ${APPLICATION_SECRET}
      TOKEN_SECRET: ${TOKEN_SECRET}
      TOKEN_KEY: ${TOKEN_KEY}
      SESSION_COOKIE_SECRET: ${SESSION_COOKIE_SECRET}
      SESSION_COOKIE_KEY: ${SESSION_COOKIE_KEY}
      FLASH_COOKIE_SECRET: ${FLASH_COOKIE_SECRET}
      FLASH_COOKIE_KEY: ${FLASH_COOKIE_KEY}
      AUTHENTICATION_COOKIE_SECRET: ${AUTHENTICATION_COOKIE_SECRET}
      AUTHENTICATION_COOKIE_KEY: ${AUTHENTICATION_COOKIE_KEY}
      PERSISTENCE_MONGO_USERNAME: ${MONGO_USERNAME}
      PERSISTENCE_MONGO_PASSWORD: ${MONGO_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTHENTICATION: ${SMTP_AUTHENTICATION:-}
      SMTP_PROTOCOL: ${SMTP_PROTOCOL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
    volumes:
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongodb/mongodb-community-server:7.0-ubi9-slim
    container_name: paprika-mongodb
    restart: unless-stopped
    environment:
      # Bootstrap-only root credential: creates the database and runs mongo-init.js on first
      # start, but is never handed to the paprika container. mongo-init.js creates the scoped
      # MONGO_USERNAME/MONGO_PASSWORD user paprika actually authenticates as (readWriteAnyDatabase
      # + dbAdminAnyDatabase — everything Paprika's per-tenant database provisioning needs, without
      # the user-management or server-administration rights a root account would also carry).
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_USERNAME: ${MONGO_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodb-data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand({ping:1})'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  mongodb-data:
