name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  package-x86:
    name: Build .deb (x86)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install packaging tools
        run: sudo apt-get install -y fakeroot binutils

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build .deb package
        run: mvn package -P package-deb-x86 -DskipTests

      - uses: actions/upload-artifact@v7
        with:
          name: deb-x86
          path: target/dist/*.deb
          if-no-files-found: error

  package-arm64:
    name: Build .deb (arm64)
    # Native arm64 hosted runner: free for public repositories, so no QEMU emulation is needed.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Install packaging tools
        run: sudo apt-get install -y fakeroot binutils

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build .deb package
        run: mvn package -P package-deb-arm64 -DskipTests

      - uses: actions/upload-artifact@v7
        with:
          name: deb-arm64
          path: target/dist/*.deb
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [package-x86, package-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -2 | tail -1)
          RANGE="${PREV_TAG:+${PREV_TAG}..}HEAD"

          changelog() {
            local prefix=$1 title=$2
            local items
            items=$(git log ${RANGE} --pretty=format:"%s" | grep -E "^${prefix}(\(.+\))?: " | sed -E "s/^${prefix}(\(.+\))?: /- /") || true
            if [ -n "$items" ]; then printf "## %s\n%s\n\n" "$title" "$items"; fi
          }

          breaking=$(git log ${RANGE} --pretty=format:"%b" | grep "^BREAKING CHANGE:" | sed "s/^BREAKING CHANGE: /- /") || true

          {
            if [ -n "$breaking" ]; then printf "## Breaking Changes\n%s\n\n" "$breaking"; fi
            changelog "feat"     "Features"
            changelog "fix"      "Bug Fixes"
            changelog "perf"     "Performance"
            changelog "refactor" "Refactoring"
            changelog "docs"     "Documentation"
            changelog "chore"    "Maintenance"
            if [ -n "$PREV_TAG" ]; then
              printf "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}\n"
            fi
          } > release-notes.md

      - name: Download .deb packages
        uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          merge-multiple: true
          path: dist

      - name: Generate checksums
        run: |
          for f in dist/*.deb; do
            sha256sum "$f" | awk '{print $1}' > "${f}.sha256"
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md \
            dist/*.deb dist/*.sha256
