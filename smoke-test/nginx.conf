upstream paprika {
    server host.docker.internal:9201;
    server host.docker.internal:9202;
}

server {
    listen 9200;

    location / {
        proxy_pass http://paprika;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
        # An instance that is draining answers 503; the request goes to the other one instead
        proxy_next_upstream error timeout http_503;
        # Which instance answered, for the round robin scenario
        add_header X-Upstream $upstream_addr always;
    }
}
